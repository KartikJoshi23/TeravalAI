# TechNova — curated policy & strategic-context fact catalog.
#
# Each fact is atomic, has a deterministic source citation, and carries category
# tags used for fast deterministic lookup. FactLoader matches the user's
# question/intent to categories and returns every relevant fact BEFORE semantic
# RAG runs — this gives the Planner and downstream agents a recall floor.
#
# Rule for adding a fact: one idea per fact, exact source (chunk_id or table),
# at least two overlapping category tags.

