facts:
- id: F-AUTO-2B3E9AE83A
  text: The AI Governance Framework was approved by the Board on January 22, 2026.
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-30B64E578A
  text: The AI Governance Framework applies to all production AI/ML models deployed by TechNova on the Nova Platform, whether
    developed in-house or sourced from third parties.
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-A4D88828A6
  text: The AI Governance Framework does not apply to research prototypes that are clearly labelled non-production.
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-AC61E2D608
  text: The AI Ethics Committee (AIEC) is constituted of five voting members.
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  - threshold
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-027AC1BEC3
  text: The Chief Technology Officer serves as chair of the AI Ethics Committee (AIEC).
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-B1B856E61F
  text: The Chief Information Security Officer is a voting member of the AI Ethics Committee (AIEC).
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  - security
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-53AE1643B9
  text: The Chief Revenue Officer, representing customer impact, is a voting member of the AI Ethics Committee (AIEC).
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  - customer_relationship
  origin: auto_pdf
  confidence: 0.94
- id: F-AUTO-B90C54C32A
  text: One independent director, currently Dr. Vikram Reddy, is a voting member of the AI Ethics Committee (AIEC).
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-EA8C49D3D9
  text: The General Counsel is a voting member of the AI Ethics Committee (AIEC).
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  - legal
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-725D86BA72
  text: The AI Ethics Committee (AIEC) meets monthly.
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-89572469F3
  text: Meeting minutes of the AI Ethics Committee (AIEC) are board-visible.
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - governance
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-84E76BC9CC
  text: The AI Ethics Committee (AIEC) has exclusive authority to approve any new AI model's promotion to production.
  source: TechNova_AI_Governance_Framework.pdf::sec1
  categories:
  - compliance
  - customer_relationship
  - governance
  - security
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-4B20A47BB7
  text: 'Every production AI model passes through five gates: (G1) Concept Approval, (G2) Training Data Approval, (G3) Bias
    and Fairness Testing, (G4) Pre-Production Risk Review, (G5) Post-Deployment Monitoring Plan.'
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - service_taxonomy
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-ECA4154BC8
  text: Gates G1 through G4 require AIEC sign-off.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-E7617D07DE
  text: G5 is operational and managed by the SRE-AI team.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - engineering
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-2FA6335096
  text: A material change requiring re-approval includes any change to the training dataset that adds or removes more than
    5% of records.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - threshold
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-E129EBB1D7
  text: A material change requiring re-approval includes any change to the loss function or model architecture.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-927C894360
  text: A material change requiring re-approval includes any change to a feature input that materially affects a protected
    attribute.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-5B9F454952
  text: A material change requiring re-approval includes any deployment to a new geographic market where the model has not
    been previously validated.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - geo_expansion
  - regulatory
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-275E08776D
  text: A material change requiring re-approval includes any change in inference latency exceeding 25% of the prior baseline.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - threshold
  - sla
  - governance
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-FDD5A1BB0A
  text: Non-material changes may be approved by the SRE-AI team alone without an AIEC vote.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - engineering
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-28A8BA6817
  text: Non-material changes must be captured in the model card.
  source: TechNova_AI_Governance_Framework.pdf::sec2
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-B9D9F44B18
  text: 'Every production model is tested for disparate impact across protected attributes: gender, age band, region, industry,
    and customer-tier.'
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-38CD23C926
  text: India-specific tests for regional bias are included in production model bias testing.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - apac
  - compliance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-AE801A7C9D
  text: Bias testing includes specific BFSI and Healthcare bias panels because of regulatory sensitivity.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - compliance
  - regulatory
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-B11A03CDF5
  text: The current bias-testing suite uses Aequitas, Fairlearn, and an in-house regulatory checklist.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-A025D8E56F
  text: 'Acceptance threshold: maximum disparity of 10 percentage points between the highest-performing and lowest-performing
    protected group on the model''s primary metric.'
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - threshold
  - compliance
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-67F63EC48D
  text: For credit and risk-scoring use cases, the disparity threshold tightens to 4 percentage points.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - threshold
  - compliance
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-462737E8DC
  text: Any disparity exceeding 5 percentage points triggers an automatic AIEC review.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - governance
  - threshold
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-88756AD310
  text: Safety testing for generative AI features includes prompt injection resistance.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - security
  - compliance
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-142D44ABB2
  text: Safety testing for generative AI features includes data exfiltration via prompts, with the constraint that no customer
    data should leave the model context.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - data_privacy
  - security
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-CDDC66BA5A
  text: Safety testing for generative AI features includes refusal-rate calibration.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.94
- id: F-AUTO-D4F1A89B89
  text: Safety testing for generative AI features includes citation-faithfulness for the AI Co-pilot feature.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-CD3D35F701
  text: Generative outputs that cite sources must achieve 95% faithfulness in QA samples.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - threshold
  - compliance
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-FDF9140FE4
  text: AI Co-pilot citation-faithfulness is currently at 96.2%.
  source: TechNova_AI_Governance_Framework.pdf::sec3
  categories:
  - ai_investment
  - compliance
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-3758469FB7
  text: 'TechNova classifies AI models into three risk tiers: Tier A (High Risk), Tier B (Medium Risk), and Tier C (Low Risk).'
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - threshold
  - criticality
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-D378B77DFD
  text: Tier A (High Risk) models are defined as any model whose output directly drives an automated decision affecting customer
    money, customer access, or regulated outcomes.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - criticality
  - regulatory
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-325D3F5D67
  text: Tier A models require unanimous AIEC approval at G1, G2, G3, and G4 gates.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - threshold
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-E6B0317881
  text: Tier A models require an external audit by a recognised AI assurance firm before launch.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - compliance
  - certification
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-AD722A48BF
  text: No Tier A models are currently in production at TechNova.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - criticality
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-FBD10848E6
  text: Tier B (Medium Risk) models include recommendation systems that materially influence customer decisions but where
    a human reviews the output.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - criticality
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-14F623A82D
  text: Tier B (Medium Risk) models include forecasting models used in operational planning.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - criticality
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-6F3B80EB65
  text: The AI Co-pilot, Predictive Forecasting (ML), and AI-Powered Anomaly Detection features are classified as Tier B.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - criticality
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-AFFFDB2C0D
  text: Tier B models require quarterly post-deployment monitoring reviews.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-7020F7AAAB
  text: Tier C (Low Risk) models include ranking, sorting, and search-relevance scoring where output is non-binding and easily
    verifiable by the user.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - criticality
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-A57C7CF27D
  text: Tier C models can be approved by the CTO and CISO jointly without full AIEC voting.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-47A9D87EB5
  text: The current Tier B inventory includes TechNova-Classify (BERT for document classification).
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-0DFD131782
  text: The current Tier B inventory includes TechNova-Extract (custom NER for data extraction).
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-52F4F97396
  text: The current Tier B inventory includes TechNova-Assist (RAG-based customer support powered by Qwen-2.5-72B with LoRA
    adapters).
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - data_model
  - customer_relationship
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-C8C1114957
  text: The current Tier B inventory includes Predictive Forecasting (ML).
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-753B51A6F9
  text: The current Tier B inventory includes AI-Powered Anomaly Detection.
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-F2A87FE587
  text: The current Tier B inventory includes AI Co-pilot (Beta).
  source: TechNova_AI_Governance_Framework.pdf::sec4
  categories:
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-B861F97EA5
  text: Every production model has a continuously-monitored model card containing model version, training-data summary, bias-test
    results, performance benchmarks, deployment regions, last AIEC review date, and known limitations.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - governance
  - compliance
  - data_model
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-74EEAC0578
  text: Model cards are accessible to Customer Success teams and on request to enterprise customers under NDA.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - governance
  - customer_relationship
  - legal
  origin: auto_pdf
  confidence: 0.94
- id: F-AUTO-7E7A9E99ED
  text: Drift monitoring uses Evidently AI with thresholds tuned per model.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - data_model
  - vendor_risk
  - governance
  origin: auto_pdf
  confidence: 0.9
- id: F-AUTO-FB0451C54E
  text: Data drift exceeding 10% on the primary feature distribution triggers a yellow alert.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - threshold
  - governance
  - data_model
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-EAE3224A65
  text: Data drift exceeding 20% on the primary feature distribution triggers a red alert and a 5-day window for remediation.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - threshold
  - incident_response
  - data_model
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-140D4D8F93
  text: Concept drift, defined as degradation of the primary metric, follows the same 10% yellow-alert threshold and 20% red-alert
    threshold as data drift.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - threshold
  - data_model
  - governance
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-34BD275CAE
  text: A model deprecation is initiated when the primary metric degrades by more than 15% from launch baseline and cannot
    be remediated within 30 days.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - threshold
  - data_model
  - governance
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-B73310A85E
  text: A model deprecation is initiated when a successor model with superior fairness or accuracy is launched.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - governance
  - data_model
  - strategy
  origin: auto_pdf
  confidence: 0.92
- id: F-AUTO-C29017C01C
  text: A model deprecation is initiated when AIEC determines the use case is no longer aligned with TechNova's policies.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - governance
  - compliance
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-8913C6B0CA
  text: Model deprecation provides 90-day notice to affected customers.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - customer_relationship
  - governance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-01D4CDC024
  text: Model deprecation provides 180-day total runway before final retirement.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - governance
  - service_taxonomy
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-C080421123
  text: The current FY2026-27 plan allocates 38% of the INR 485 crore total product investment budget to AI/ML capabilities.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - ai_investment
  - budget
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-1C24DB5BB5
  text: The FY2026-27 allocation to AI/ML capabilities equals INR 184.30 crores.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - ai_investment
  - budget
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-996520E2C9
  text: Infrastructure in the FY2026-27 plan includes a planned self-hosted RAG stack on 4x A100 nodes with customer-specific
    Qdrant vector indices.
  source: TechNova_AI_Governance_Framework.pdf::sec5
  categories:
  - infrastructure
  - cloud_infrastructure
  - data_model
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-DC52E94137
  text: Every customer using a Tier-A or Tier-B AI feature receives a model card excerpt at activation.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - compliance
  - customer_relationship
  - data_model
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-2A696748E0
  text: The model card excerpt summarises what the model does, what data it uses, what its known limitations are, and what
    disparate-impact testing has been done.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - compliance
  - data_model
  - governance
  origin: auto_pdf
  confidence: 0.95
- id: F-AUTO-637A6DFDDF
  text: The customer's MSA Data Processing Addendum (DPA) governs how that customer's data may be used in model training.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - data_privacy
  - legal
  - compliance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-4C55913620
  text: By default, customer data is NOT used to train shared models without explicit opt-in.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - data_privacy
  - compliance
  - dpdp
  origin: auto_pdf
  confidence: 0.99
- id: F-AUTO-79A2014A25
  text: Customers may request that AI predictions affecting them be reviewed by a human within 5 business days.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - compliance
  - customer_relationship
  - threshold
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-017430BD6B
  text: Customers may request the deactivation of any AI feature on their tenant within 24 hours.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - customer_relationship
  - compliance
  - threshold
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-2D5455B76A
  text: Customers may request a copy of bias-testing results under NDA.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - compliance
  - legal
  - customer_relationship
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-69ABA19A16
  text: TechNova will support customer auditors examining AI model usage on their data with up to 8 hours of engineer time
    per quarter, included in the standard MSA.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - compliance
  - customer_relationship
  - engineering
  origin: auto_pdf
  confidence: 0.98
- id: F-AUTO-C4A4EF950A
  text: Additional audit support is billable.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - compliance
  - customer_relationship
  origin: auto_pdf
  confidence: 0.9
- id: F-AUTO-1A1092A37B
  text: TechNova maintains a regulatory-mapping document for jurisdictions with AI-specific regulations, currently the EU
    AI Act and emerging India AI Act draft.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - regulatory
  - compliance
  - governance
  origin: auto_pdf
  confidence: 0.96
- id: F-AUTO-8067433270
  text: The regulatory-mapping document was last refreshed in March 2026.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - regulatory
  - compliance
  origin: auto_pdf
  confidence: 0.97
- id: F-AUTO-90B17BACEA
  text: The regulatory-mapping document maps each Tier-A/B model to applicable regulatory categories.
  source: TechNova_AI_Governance_Framework.pdf::sec6
  categories:
  - regulatory
  - data_model
  - governance
  origin: auto_pdf
  confidence: 0.96
