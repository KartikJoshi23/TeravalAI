# Render blueprint for the Teraval AI Finance Assistant (FastAPI backend).
# Deploy: Render Dashboard → New → Blueprint → connect this repo. Render reads this
# file, creates the service, and (because NVIDIA_NIM_API_KEY has sync:false) prompts
# you to paste the key. Full walkthrough: DEPLOYMENT.md.
services:
  - type: web
    name: teraval-assistant
    runtime: python
    rootDir: assistant           # the FastAPI app lives in assistant/
    plan: free                   # free tier spins down when idle → ~50 s cold start
    region: frankfurt            # closest of Render's regions to the UAE audience
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health     # Render polls this; also what the frontend badge hits
    autoDeploy: true             # redeploy on every push to the default branch
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"          # pin the runtime; bump if Render lacks this patch
      - key: NVIDIA_NIM_API_KEY
        sync: false              # secret — paste in the Render dashboard, never commit
      - key: NIM_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      # Allow the deployed Vercel frontend (production + rotating preview URLs).
      - key: CORS_ORIGIN_REGEX
        value: 'https://([a-z0-9-]+\.)*vercel\.app'
      # Optional: add a custom domain here if you attach one to the Vercel project.
      # - key: CORS_ORIGINS
      #   value: https://your-custom-domain.com
